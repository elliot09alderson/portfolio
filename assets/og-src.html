<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;}
  body{
    width:1200px;height:630px;overflow:hidden;
    background:#12181A;color:#EBEDEB;
    font-family:"Helvetica Neue",Arial,sans-serif;
    display:flex;flex-direction:column;justify-content:space-between;
    box-sizing:border-box;padding:64px 72px;
  }
  .top{display:flex;justify-content:space-between;align-items:center;
    font-family:Menlo,monospace;font-size:18px;letter-spacing:.18em;color:#6E7A78;}
  .top .rec{color:#C4271A;display:flex;align-items:center;gap:12px;}
  .dot{width:14px;height:14px;border-radius:50%;background:#C4271A;display:inline-block;}
  h1{font-size:104px;font-weight:800;letter-spacing:-.04em;line-height:.92;margin:0;text-transform:uppercase;}
  h1 span{color:#5b6a6c;}
  .sub{font-size:30px;color:#9AA6A4;margin-top:28px;letter-spacing:-.01em;}
  .wave{display:flex;align-items:center;gap:7px;height:70px;}
  .wave i{width:7px;background:#14524E;border-radius:4px;display:block;}
  .bottom{display:flex;justify-content:space-between;align-items:flex-end;}
  .tags{font-family:Menlo,monospace;font-size:19px;color:#6E7A78;letter-spacing:.08em;}
</style>
</head>
<body>
  <div class="top">
    <span>PRATIK VERMA — SENIOR SOFTWARE ENGINEER</span>
    <span class="rec"><span class="dot"></span>REC</span>
  </div>
  <div>
    <h1>AI systems that<br><span>survive production.</span></h1>
    <div class="sub">Agentic AI &middot; RAG &middot; AI voice agents &middot; Backend platforms &middot; Python / FastAPI / Node.js / AWS</div>
  </div>
  <div class="bottom">
    <div class="wave" id="w"></div>
    <div class="tags">300+ interviews/day &middot; 99.8% OCR &middot; 4 yrs</div>
  </div>
  <script>
    const w=document.getElementById("w");
    for(let i=0;i<46;i++){
      const t=i/45, env=Math.min(1,t*6)*Math.min(1,(1-t)*6);
      const n=Math.abs(.5*Math.sin(i*.7+1.3)+.3*Math.sin(i*1.9+.4)+.2*Math.sin(i*4.3+2.1));
      const b=document.createElement("i");
      b.style.height=Math.max(6, env*(0.3+0.7*n)*70)+"px";
      w.appendChild(b);
    }
  </script>
</body>
</html>
